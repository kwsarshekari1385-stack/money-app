<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f45b93"><link rel="manifest" href="manifest.webmanifest"><title>MONEY</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff6fa;color:#432735;font-family:Tahoma,Arial,sans-serif}
.app{max-width:480px;margin:auto;min-height:100vh;padding-bottom:90px}.top{padding:22px 18px 12px;display:flex;justify-content:space-between}
.brand{font-size:27px;font-weight:900;color:#f45b93}.sub{font-size:12px;color:#9b7b89;margin-top:4px}
.icon{border:0;background:#fff;width:42px;height:42px;border-radius:15px;color:#f45b93;font-size:22px;box-shadow:0 5px 18px #e9b6c933}
.balance{margin:10px 18px;padding:21px;border-radius:27px;background:linear-gradient(135deg,#f45b93,#ff9cbd);color:#fff;box-shadow:0 14px 30px #f45b9340}
.balance small{opacity:.9}.amount{font-size:29px;font-weight:900;margin:7px 0 15px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:10px;border-radius:15px;background:#ffffff28}.stat b{display:block;margin-top:4px}
.sec{padding:0 18px;margin-top:20px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.head h3{margin:0;font-size:16px}.link{border:0;background:none;color:#f45b93;font-size:11px}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.cat{border:1px solid #f4dce6;background:#fff;border-radius:17px;padding:11px 4px;color:#432735}.cat span{font-size:21px;display:block}.cat small{font-size:10px;color:#947481}
.tx{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #f4dce6;border-radius:19px;padding:12px;margin:8px 0}.bubble{width:40px;height:40px;border-radius:14px;background:#fff0f5;display:grid;place-items:center}.main{flex:1}.main b{display:block;font-size:13px}.main small{font-size:10px;color:#947481}.inc{color:#31aa75;font-weight:800}.exp{color:#df5870;font-weight:800}
.empty{text-align:center;background:#fff;border:1px dashed #f1ccd9;border-radius:19px;padding:25px;color:#987684}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);height:76px;background:#ffffffee;backdrop-filter:blur(15px);border-top:1px solid #f2dbe4;display:flex;align-items:center;justify-content:space-around;z-index:5}.nav button{border:0;background:none;color:#9b7b89;font-size:10px}.nav .active{color:#f45b93;font-weight:900}.plus{width:56px;height:56px;border-radius:20px!important;background:#f45b93!important;color:#fff!important;font-size:27px!important;box-shadow:0 9px 22px #f45b9345}
.modal{display:none;position:fixed;inset:0;background:#3c1e2b66;z-index:10;align-items:flex-end}.sheet{width:min(480px,100%);margin:auto;background:#fff;border-radius:28px 28px 0 0;padding:20px}.sheet h2{margin:0 0 14px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tabs button{border:0;border-radius:13px;padding:11px;background:#fff0f5;color:#f45b93}.tabs .on{background:#f45b93;color:#fff}.field{margin:11px 0}.field label{display:block;color:#947481;font-size:11px;margin-bottom:6px}.field input,.field select{width:100%;padding:13px;border:1px solid #f2dbe4;border-radius:14px;background:#fff;outline:none}.save{width:100%;border:0;padding:14px;border-radius:15px;background:#f45b93;color:#fff;font-weight:800;margin-top:4px}
.toast{display:none;position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:20;background:#432735;color:#fff;padding:10px 16px;border-radius:14px;font-size:12px}
</style><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));}</script></head><body>
<div class="app">
<header class="top"><div><div class="brand">MONEY ♡</div><div class="sub">مدیریت پول، ساده و دوست‌داشتنی</div></div><button class="icon" onclick="toast('MONEY آماده‌ست 💗')">♡</button></header>
<section class="balance"><small>موجودی کل</small><div class="amount" id="bal">۰ تومان</div><div class="stats"><div class="stat"><small>درآمد این ماه</small><b id="inc">۰</b></div><div class="stat"><small>هزینه این ماه</small><b id="exp">۰</b></div></div></section>
<section class="sec"><div class="head"><h3>دسته‌بندی‌ها</h3></div><div class="cats">
<button class="cat" onclick="openAdd('expense','خرید')"><span>🛍️</span><small>خرید</small></button>
<button class="cat" onclick="openAdd('expense','خوراکی')"><span>🍰</span><small>خوراکی</small></button>
<button class="cat" onclick="openAdd('expense','حمل‌ونقل')"><span>🚕</span><small>حمل‌ونقل</small></button>
<button class="cat" onclick="openAdd('expense','قبض')"><span>💗</span><small>قبض</small></button></div></section>
<section class="sec"><div class="head"><h3>تراکنش‌های اخیر</h3><button class="link" onclick="toast('در نسخه بعدی گزارش کامل اضافه می‌شود')">بیشتر</button></div><div id="list"></div></section>
</div>
<nav class="nav"><button class="active">⌂<br>خانه</button><button onclick="toast('گزارش‌ها به‌زودی')">◔<br>گزارش‌ها</button><button class="plus" onclick="openAdd()">＋</button><button onclick="toast('هدف‌ها به‌زودی')">♡<br>هدف‌ها</button><button onclick="toast('تنظیمات به‌زودی')">☰<br>بیشتر</button></nav>
<div class="modal" id="modal" onclick="if(event.target===this)closeAdd()"><div class="sheet"><h2>افزودن تراکنش 💗</h2>
<div class="tabs"><button id="eTab" class="on" onclick="setType('expense')">هزینه</button><button id="iTab" onclick="setType('income')">درآمد</button></div>
<div class="field"><label>عنوان</label><input id="title" placeholder="مثلاً خرید لباس"></div>
<div class="field"><label>مبلغ (تومان)</label><input id="amount" inputmode="numeric" placeholder="مثلاً ۵۰۰۰۰۰"></div>
<div class="field"><label>دسته‌بندی</label><select id="cat"><option>خرید</option><option>خوراکی</option><option>حمل‌ونقل</option><option>قبض</option><option>سرگرمی</option><option>سایر</option></select></div>
<button class="save" onclick="save()">ذخیره تراکنش</button></div></div><div class="toast" id="toastBox"></div>
<script>
let type='expense',data=JSON.parse(localStorage.getItem('money')||'[]');
const fa=n=>Number(n||0).toLocaleString('fa-IR');
function setType(t){type=t;eTab.className=t==='expense'?'on':'';iTab.className=t==='income'?'on':''}
function openAdd(t='expense',c=''){setType(t);cat.value=c||'خرید';title.value='';amount.value='';modal.style.display='flex'}
function closeAdd(){modal.style.display='none'}
function save(){let a=parseInt((amount.value||'').replace(/[^\d]/g,''));if(!a){toast('مبلغ را وارد کن 💗');return}data.unshift({type,amount:a,title:title.value.trim()||cat.value,cat:cat.value,date:new Date().toLocaleDateString('fa-IR')});localStorage.setItem('money',JSON.stringify(data));closeAdd();render();toast('تراکنش ذخیره شد ✨')}
function render(){let i=data.filter(x=>x.type==='income').reduce((s,x)=>s+x.amount,0),e=data.filter(x=>x.type==='expense').reduce((s,x)=>s+x.amount,0);bal.textContent=fa(i-e)+' تومان';inc.textContent=fa(i);exp.textContent=fa(e);list.innerHTML=data.length?data.slice(0,8).map(x=>`<div class="tx"><div class="bubble">${x.type==='income'?'💰':'💸'}</div><div class="main"><b>${x.title}</b><small>${x.cat} · ${x.date}</small></div><div class="${x.type==='income'?'inc':'exp'}">${x.type==='income'?'+':'−'}${fa(x.amount)}</div></div>`).join(''):'<div class="empty">هنوز تراکنشی ثبت نکردی 🌷<br><small>با دکمه + شروع کن</small></div>'}
function toast(t){toastBox.textContent=t;toastBox.style.display='block';clearTimeout(window.x);window.x=setTimeout(()=>toastBox.style.display='none',1800)} render();
</script></body></html>
